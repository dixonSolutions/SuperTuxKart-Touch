name: Android

on:
  push:
    # main goes through build-and-publish.yml, which calls this workflow —
    # keeping '**' here would build every APK twice on every release commit.
    branches-ignore: [main, master]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version name stamped into the APK
        type: string
        required: true
      version_code:
        description: Monotonic Android versionCode
        type: string
        required: true
    outputs:
      version:
        value: ${{ inputs.version }}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  STK_NDK_VERSION: 28.1.13356709

jobs:
  apk:
    name: APK (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # `secrets` is not a context step-level `if` can read; hoist the check.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            abi: arm64-v8a
          - arch: armv7
            abi: armeabi-v7a
          # Waydroid, Chromebooks and the Android emulator. Also what lets
          # the self-updater be exercised on a desktop before a release.
          - arch: x86_64
            abi: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          CODE="${{ inputs.version_code }}"
          # Branch builds (no workflow_call inputs) still need a unique code.
          [ -n "$VERSION" ] || VERSION="1.0.${{ github.run_number }}"
          [ -n "$CODE" ] || CODE="${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # The SDK + NDK + 228 MB of assets + four dependency trees do not fit
      # alongside the runner's preinstalled toolchains.
      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            autoconf automake libtool make gcc g++ pkg-config \
            flex bison cmake meson ninja-build \
            imagemagick pngquant advancecomp optipng libjpeg-turbo-progs \
            vorbis-tools unzip curl xz-utils python3 python3-pip ccache
          pip3 install --break-system-packages --quiet packaging mako

      # ndk-build honours NDK_CCACHE; make.sh exports it when ccache is on
      # PATH. The cache key is per commit with a prefix fallback, so every
      # run restores the newest cache and saves its own -- an exact-hit key
      # would never be re-saved and go stale.
      - name: Cache ccache (native game code)
        uses: actions/cache@v4
        with:
          # A literal path: `env:` values are not shell-expanded, so a ~ in
          # CCACHE_DIR would have ccache write to a directory named "~".
          path: ${{ github.workspace }}/.ccache
          key: stk-android-ccache-${{ matrix.abi }}-${{ env.STK_NDK_VERSION }}-${{ github.sha }}
          restore-keys: |
            stk-android-ccache-${{ matrix.abi }}-${{ env.STK_NDK_VERSION }}-

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK ${{ env.STK_NDK_VERSION }}
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${STK_NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          test -d "$ANDROID_SDK_ROOT/ndk/${STK_NDK_VERSION}"

      - name: Cache upstream dependency sources
        uses: actions/cache@v4
        with:
          path: build/android/dependencies-android-src-*.tar.xz
          key: stk-android-deps-src-preview-v1

      - name: Cache game assets
        uses: actions/cache@v4
        with:
          path: build/android/stk-assets
          key: stk-android-assets-v1-${{ hashFiles('engine/CMakeLists.txt') }}

      - name: Cache compiled native dependencies
        uses: actions/cache@v4
        with:
          path: engine/android/deps-${{ matrix.abi }}
          key: stk-android-deps-${{ matrix.abi }}-${{ env.STK_NDK_VERSION }}-v2

      - name: Decode signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p build/android
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > build/android/release.keystore
          echo "STK_KEYSTORE=$PWD/build/android/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_ARCHS: ${{ matrix.arch }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
          PROJECT_VERSION: ${{ steps.ver.outputs.version }}
          PROJECT_CODE: ${{ steps.ver.outputs.code }}
          STK_STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STK_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash scripts/android-build.sh

      - name: Show APK metadata
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euo pipefail
          ccache -s 2>/dev/null | head -12 || true
          APK="$(find build/android-out -name '*.apk' | head -1)"
          ls -lh "$APK"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 | sort -r | head -1)"
          "$AAPT" dump badging "$APK" | head -20 || true
          unzip -l "$APK" | grep -E 'lib/' | head -10

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: build/android-out/*.apk
          if-no-files-found: error
