name: Build and publish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-publish-${{ github.ref }}
  # Cancel stale runs so Click/OpenStore fixes are not stuck behind long Flatpak jobs.
  cancel-in-progress: true

env:
  FLATPAK_APP_ID: io.github.dixonSolutions.SuperTuxKartTouch
  # Distinct from Flathub "flathub" / net.supertuxkart.SuperTuxKart — touch keyword in remote name.
  FLATPAK_REMOTE_NAME: supertuxtouch
  FLATPAK_REMOTE_URL: https://dixonSolutions.github.io/SuperTuxKart-Touch/flatpak
  CLICK_NAME: supertuxkarttouch.dixonsolutions
  CLICK_FRAMEWORK: ubuntu-touch-24.04-1.x
  CLICK_REMOTE_URL: https://dixonSolutions.github.io/SuperTuxKart-Touch/click

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      tag: ${{ steps.stamp.outputs.tag }}
    steps:
      - name: Compute version
        id: stamp
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: [version]
    # Native runners — aarch64 under QEMU on x86 was ~4h; ubuntu-24.04-arm is ~15m.
    runs-on: ${{ matrix.runner }}
    container:
      # Builder image tracks Flathub CI; runtime/SDK come from the manifest (25.08).
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Stamp metainfo version
        run: |
          sed -i "s/version=\"1.0.0\"/version=\"${{ needs.version.outputs.version }}\"/" \
            flatpak/io.github.dixonSolutions.SuperTuxKartTouch.metainfo.xml

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: SuperTuxKartTouch-${{ needs.version.outputs.version }}-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/io.github.dixonSolutions.SuperTuxKartTouch.yml
          arch: ${{ matrix.arch }}
          keep-build-dirs: true
          cache-key: stk-touch-${{ matrix.arch }}-v2-${{ hashFiles('flatpak/*.yml', 'scripts/**', 'packaging/**', 'engine/CMakeLists.txt') }}
          restore-cache: true

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: SuperTuxKartTouch-${{ needs.version.outputs.version }}-${{ matrix.arch }}.flatpak

  click:
    name: Click (${{ matrix.arch }})
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armhf]
    steps:
      - uses: actions/checkout@v4

      - name: Build Click package
        uses: tuxecure/clickable@v2
        with:
          image: clickable/ci-ut24.04-1.x-${{ matrix.arch }}
          run: |
            printf '%s\n' "${{ needs.version.outputs.version }}" > click/.ci-version
            printf '%s\n' "${{ env.CLICK_NAME }}" > click/.ci-name
            printf '%s\n' "${{ env.CLICK_FRAMEWORK }}" > click/.ci-framework
            clickable build --arch ${{ matrix.arch }} --skip-review --verbose

      - name: Collect Click artifact
        run: |
          mkdir -p click-out
          mapfile -t clicks < <(find . -name '*.click' -type f | head -20)
          if [ "${#clicks[@]}" -eq 0 ]; then
            echo "No .click artifact produced" >&2
            exit 1
          fi
          cp "${clicks[0]}" "click-out/SuperTuxKartTouch-${{ needs.version.outputs.version }}-${{ matrix.arch }}.click"

      - uses: actions/upload-artifact@v4
        with:
          name: click-${{ matrix.arch }}
          path: click-out/*.click

  android:
    name: Android
    needs: [version]
    # Same job as the standalone Android workflow; that one skips main so the
    # APKs are not built twice for a release commit.
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      version_code: ${{ github.run_number }}

  publish-pages:
    name: Publish Pages (Flatpak + Click remotes)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [version, flatpak, click]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build Flatpak OSTree + Click download remote
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
          FLATPAK_REMOTE_URL: ${{ env.FLATPAK_REMOTE_URL }}
          FLATPAK_REMOTE_NAME: ${{ env.FLATPAK_REMOTE_NAME }}
          FLATPAK_APP_ID: ${{ env.FLATPAK_APP_ID }}
          CLICK_REMOTE_URL: ${{ env.CLICK_REMOTE_URL }}
          CLICK_NAME: ${{ env.CLICK_NAME }}
          PRUNE_DEPTH: '40'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak ostree
          chmod +x scripts/publish-flatpak-remote.sh scripts/publish-click-remote.sh
          mkdir -p site
          X86_BUNDLE="$(find artifacts/flatpak-x86_64 -name '*.flatpak' | head -1)"
          A64_BUNDLE="$(find artifacts/flatpak-aarch64 -name '*.flatpak' | head -1)"
          ARM64_CLICK="$(find artifacts/click-arm64 -name '*.click' | head -1)"
          ARMHF_CLICK="$(find artifacts/click-armhf -name '*.click' | head -1)"
          test -n "$X86_BUNDLE" || { echo "Missing x86_64 flatpak" >&2; exit 1; }
          test -n "$A64_BUNDLE" || { echo "Missing aarch64 flatpak" >&2; exit 1; }
          test -n "$ARM64_CLICK" || { echo "Missing arm64 click" >&2; exit 1; }
          test -n "$ARMHF_CLICK" || { echo "Missing armhf click" >&2; exit 1; }
          bash scripts/publish-flatpak-remote.sh \
            --x86 "$X86_BUNDLE" \
            --aarch64 "$A64_BUNDLE" \
            --version "$PACKAGE_VERSION"
          bash scripts/publish-click-remote.sh \
            --arm64 "$ARM64_CLICK" \
            --armhf "$ARMHF_CLICK" \
            --version "$PACKAGE_VERSION"
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8"><title>SuperTuxTouch packages</title></head>
          <body>
          <h1>SuperTuxTouch packages</h1>
          <p>Touch port — separate from Flathub SuperTuxKart (<code>net.supertuxkart.SuperTuxKart</code>).</p>
          <ul>
            <li><a href="flatpak/">Flatpak remote</a> (<code>supertuxtouch</code> — x86_64 + aarch64)</li>
            <li><a href="click/">Ubuntu Touch .click</a> (arm64 + armhf)</li>
            <li><a href="https://github.com/dixonSolutions/SuperTuxKart-Touch/releases/latest">GitHub Releases</a> (offline .flatpak + .click)</li>
          </ul>
          <p>Build ${PACKAGE_VERSION}</p>
          </body></html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: GitHub Release
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [version, flatpak, click, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Prepare release files + notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          FLATPAK_REMOTE_NAME: ${{ env.FLATPAK_REMOTE_NAME }}
          FLATPAK_REMOTE_URL: ${{ env.FLATPAK_REMOTE_URL }}
          FLATPAK_APP_ID: ${{ env.FLATPAK_APP_ID }}
        run: |
          mkdir -p release/upload
          cp release/flatpak-x86_64/*.flatpak release/upload/
          cp release/flatpak-aarch64/*.flatpak release/upload/
          cp release/click-arm64/*.click release/upload/
          cp release/click-armhf/*.click release/upload/
          cp release/android-arm64-v8a/*.apk release/upload/
          cp release/android-armeabi-v7a/*.apk release/upload/
          ls -la release/upload/
          {
            echo "## SuperTuxTouch ${VERSION}"
            echo
            echo "Touch-first SuperTuxKart — **not** Flathub \`net.supertuxkart.SuperTuxKart\`."
            echo "App id: \`${FLATPAK_APP_ID}\`. Flatpak remote: \`${FLATPAK_REMOTE_NAME}\`."
            echo
            echo "### Flatpak remote (recommended)"
            echo '```bash'
            echo "flatpak remote-add --user --if-not-exists --no-gpg-verify ${FLATPAK_REMOTE_NAME} \\"
            echo "  ${FLATPAK_REMOTE_URL}"
            echo "flatpak install --user ${FLATPAK_REMOTE_NAME} ${FLATPAK_APP_ID}"
            echo "flatpak run ${FLATPAK_APP_ID}"
            echo "# First launch downloads race assets (or reuses Flathub STK if installed)."
            echo '```'
            echo
            echo "### Offline Flatpak bundles (this release)"
            echo '```bash'
            echo "flatpak install --user SuperTuxKartTouch-${VERSION}-x86_64.flatpak"
            echo "# or: SuperTuxKartTouch-${VERSION}-aarch64.flatpak"
            echo '```'
            echo
            echo "### Ubuntu Touch (.click)"
            echo
            echo '<a href="https://open-store.io/app/supertuxkarttouch.dixonsolutions"><img src="https://open-store.io/badges/en_US.svg" alt="OpenStore" width="200" /></a>'
            echo
            echo "- https://dixonSolutions.github.io/SuperTuxKart-Touch/click/latest-arm64.click"
            echo "- https://dixonSolutions.github.io/SuperTuxKart-Touch/click/latest-armhf.click"
            echo
            echo "### Android (.apk)"
            echo
            echo "Sideload — arm64-v8a for anything from the last decade, armeabi-v7a for older phones:"
            echo
            echo "- \`SuperTuxKartTouch-${VERSION}-arm64-v8a.apk\`"
            echo "- \`SuperTuxKartTouch-${VERSION}-armeabi-v7a.apk\`"
            echo
            echo "Karts and tracks are bundled — no first-launch download."
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
          } > release/notes.md

      - name: Create versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: SuperTuxTouch ${{ needs.version.outputs.version }}
          body_path: release/notes.md
          files: release/upload/*
          fail_on_unmatched_files: true
          make_latest: true
          target_commitish: ${{ github.sha }}

      # The shipped app finds its update by tag shape and asset filename. Both
      # are conventions, and breaking either strands every install silently.
      - name: Verify the release can drive in-app updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/android-verify-update-feed.sh

  openstore:
    name: OpenStore upload
    needs: [version, click]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload revisions + publish
        env:
          OPENSTORE_API_KEY: ${{ secrets.OPENSTORE_API_KEY }}
          CLICK_NAME: ${{ env.CLICK_NAME }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${OPENSTORE_API_KEY:-}" ]; then
            echo "OPENSTORE_API_KEY secret is missing — cannot publish to OpenStore." >&2
            exit 1
          fi
          chmod +x scripts/publish-openstore.sh
          mapfile -t CLICKS < <(find artifacts/click-arm64 artifacts/click-armhf -name '*.click' -type f | sort)
          if [ "${#CLICKS[@]}" -lt 2 ]; then
            echo "Expected arm64 + armhf .click artifacts, found ${#CLICKS[@]}" >&2
            find artifacts -type f | head -50 >&2 || true
            exit 1
          fi
          bash scripts/publish-openstore.sh "${CLICKS[@]}"
