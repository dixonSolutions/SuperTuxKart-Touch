name: Build and publish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-publish-${{ github.ref }}
  # Cancel stale runs so Click/OpenStore fixes are not stuck behind long Flatpak jobs.
  cancel-in-progress: true

env:
  FLATPAK_APP_ID: io.github.dixonSolutions.SuperTuxKartTouch
  FLATPAK_REMOTE_NAME: supertuxkart-touch
  FLATPAK_REMOTE_URL: https://dixonSolutions.github.io/SuperTuxKart-Touch/flatpak
  CLICK_NAME: supertuxkarttouch.dixonsolutions
  CLICK_FRAMEWORK: ubuntu-touch-24.04-1.x
  CLICK_REMOTE_URL: https://dixonSolutions.github.io/SuperTuxKart-Touch/click

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      tag: ${{ steps.stamp.outputs.tag }}
    steps:
      - name: Compute version
        id: stamp
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: [version]
    runs-on: ubuntu-latest
    container:
      # Builder image tracks Flathub CI; runtime/SDK come from the manifest (25.08).
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Docker for QEMU
        if: matrix.arch != 'x86_64'
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-26.0.0.tgz \
            --output ./docker.tgz
          tar xzf docker.tgz
          mv docker/* /usr/bin

      - name: Set up QEMU
        if: matrix.arch != 'x86_64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Stamp metainfo version
        run: |
          sed -i "s/version=\"1.0.0\"/version=\"${{ needs.version.outputs.version }}\"/" \
            flatpak/io.github.dixonSolutions.SuperTuxKartTouch.metainfo.xml

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: SuperTuxKartTouch-${{ needs.version.outputs.version }}-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/io.github.dixonSolutions.SuperTuxKartTouch.yml
          arch: ${{ matrix.arch }}
          keep-build-dirs: true
          cache-key: stk-touch-${{ matrix.arch }}-v1-${{ hashFiles('flatpak/*.yml', 'scripts/**', 'packaging/**', 'engine/CMakeLists.txt') }}
          restore-cache: true

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: SuperTuxKartTouch-${{ needs.version.outputs.version }}-${{ matrix.arch }}.flatpak

  click:
    name: Click (${{ matrix.arch }})
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armhf]
    steps:
      - uses: actions/checkout@v4

      - name: Build Click package
        uses: tuxecure/clickable@v2
        with:
          image: clickable/ci-ut24.04-1.x-${{ matrix.arch }}
          run: |
            printf '%s\n' "${{ needs.version.outputs.version }}" > click/.ci-version
            printf '%s\n' "${{ env.CLICK_NAME }}" > click/.ci-name
            printf '%s\n' "${{ env.CLICK_FRAMEWORK }}" > click/.ci-framework
            clickable build --arch ${{ matrix.arch }} --skip-review --verbose

      - name: Collect Click artifact
        run: |
          mkdir -p click-out
          mapfile -t clicks < <(find . -name '*.click' -type f | head -20)
          if [ "${#clicks[@]}" -eq 0 ]; then
            echo "No .click artifact produced" >&2
            exit 1
          fi
          cp "${clicks[0]}" "click-out/SuperTuxKartTouch-${{ needs.version.outputs.version }}-${{ matrix.arch }}.click"

      - uses: actions/upload-artifact@v4
        with:
          name: click-${{ matrix.arch }}
          path: click-out/*.click

  publish-pages:
    name: Publish Pages remotes
    needs: [version, flatpak, click]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree appstream-util

      - name: Assemble Flatpak + Click remotes
        run: |
          set -euo pipefail
          VER="${{ needs.version.outputs.version }}"
          mkdir -p public/flatpak public/click
          # OSTree repo
          ostree init --mode=archive-z2 --repo=public/flatpak
          for arch in x86_64 aarch64; do
            BUNDLE="artifacts/flatpak-${arch}/SuperTuxKartTouch-${VER}-${arch}.flatpak"
            test -f "$BUNDLE"
            flatpak build-import-bundle --update-appstream public/flatpak "$BUNDLE"
          done
          # Click latest pointers
          for arch in arm64 armhf; do
            SRC="artifacts/click-${arch}/SuperTuxKartTouch-${VER}-${arch}.click"
            test -f "$SRC"
            cp "$SRC" "public/click/SuperTuxKartTouch-${VER}-${arch}.click"
            cp "$SRC" "public/click/latest-${arch}.click"
          done
          cat > public/click/index.html <<EOF
          <!doctype html><title>SuperTuxKart Touch Click</title>
          <h1>SuperTuxKart Touch Click packages</h1>
          <ul>
            <li><a href="latest-arm64.click">latest-arm64.click</a></li>
            <li><a href="latest-armhf.click">latest-armhf.click</a></li>
          </ul>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: false

  release:
    name: GitHub Release
    needs: [version, flatpak, click]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: SuperTuxKart Touch ${{ needs.version.outputs.version }}
          files: |
            artifacts/flatpak-x86_64/*
            artifacts/flatpak-aarch64/*
            artifacts/click-arm64/*
            artifacts/click-armhf/*
          body: |
            ## SuperTuxKart Touch ${{ needs.version.outputs.version }}

            ### Flatpak
            ```bash
            flatpak remote-add --user --if-not-exists --no-gpg-verify supertuxkart-touch \
              https://dixonSolutions.github.io/SuperTuxKart-Touch/flatpak
            flatpak install --user supertuxkart-touch io.github.dixonSolutions.SuperTuxKartTouch
            ```
            Requires Flathub `net.supertuxkart.SuperTuxKart` for race assets (tracks/karts).

            ### Click (Ubuntu Touch)
            - OpenStore (when published), or
            - https://dixonSolutions.github.io/SuperTuxKart-Touch/click/latest-arm64.click

  openstore:
    name: OpenStore upload
    needs: [version, click]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload revisions + publish
        env:
          OPENSTORE_API_KEY: ${{ secrets.OPENSTORE_API_KEY }}
          CLICK_NAME: ${{ env.CLICK_NAME }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${OPENSTORE_API_KEY:-}" ]; then
            echo "OPENSTORE_API_KEY secret is missing — cannot publish to OpenStore." >&2
            exit 1
          fi
          REVISION_CHANGELOG="SuperTuxKart Touch ${VERSION}: glass HUD, thermal profile, packaging."
          mapfile -t CLICKS < <(find artifacts/click-arm64 artifacts/click-armhf -name '*.click' -type f | sort)
          if [ "${#CLICKS[@]}" -lt 2 ]; then
            echo "Expected arm64 + armhf .click artifacts, found ${#CLICKS[@]}" >&2
            find artifacts -type f | head -50 >&2 || true
            exit 1
          fi
          for f in "${CLICKS[@]}"; do
            echo "Publishing $(basename "$f") → OpenStore ${CLICK_NAME}..."
            http_code="$(
              curl -sS -o /tmp/openstore-resp.json -w '%{http_code}' \
                --connect-timeout 30 --max-time 900 \
                -X POST \
                -F "file=@${f}" \
                -F "channel=focal" \
                -F "changelog=${REVISION_CHANGELOG}" \
                "https://open-store.io/api/v3/manage/${CLICK_NAME}/revision?apikey=${OPENSTORE_API_KEY}"
            )"
            echo "HTTP ${http_code}"
            cat /tmp/openstore-resp.json || true
            python3 -c 'import json,sys; d=json.load(open("/tmp/openstore-resp.json")); sys.exit(0 if d.get("success") else 1)' \
              || { echo "OpenStore revision rejected for $f" >&2; exit 1; }
            if [ "$http_code" != "200" ]; then
              echo "OpenStore upload failed for $f" >&2
              exit 1
            fi
          done
          # Flip Published=Yes once revisions exist (listing + screenshots already set).
          curl -sS -o /tmp/openstore-pub.json -w 'publish HTTP %{http_code}\n' -X PUT \
            -F "published=true" \
            -F "changelog=${REVISION_CHANGELOG}" \
            "https://open-store.io/api/v3/manage/${CLICK_NAME}?apikey=${OPENSTORE_API_KEY}"
          cat /tmp/openstore-pub.json || true
          python3 -c 'import json,sys; d=json.load(open("/tmp/openstore-pub.json")); sys.exit(0 if d.get("success") and d.get("data",{}).get("published") else 1)'
          echo "OpenStore published: https://open-store.io/app/${CLICK_NAME}"
