name: OpenStore republish

# Re-upload Click revisions from an existing GitHub Release without rebuilding.
# Use when OpenStore returns transient 502/503 on one arch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.0.16)
        required: true
        type: string

env:
  CLICK_NAME: supertuxkarttouch.dixonsolutions

jobs:
  openstore:
    name: OpenStore upload from release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release .click assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p clicks
          VERSION="${TAG#v}"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir clicks \
            --pattern "SuperTuxKartTouch-${VERSION}-arm64.click" \
            --pattern "SuperTuxKartTouch-${VERSION}-armhf.click"
          ls -lh clicks/

      - name: Upload revisions + publish
        env:
          OPENSTORE_API_KEY: ${{ secrets.OPENSTORE_API_KEY }}
          CLICK_NAME: ${{ env.CLICK_NAME }}
          VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          export VERSION
          chmod +x scripts/publish-openstore.sh
          mapfile -t CLICKS < <(find clicks -name '*.click' -type f | sort)
          test "${#CLICKS[@]}" -eq 2
          bash scripts/publish-openstore.sh "${CLICKS[@]}"
