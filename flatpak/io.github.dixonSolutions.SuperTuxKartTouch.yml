app-id: io.github.dixonSolutions.SuperTuxKartTouch
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: start.sh

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-data/supertuxkart-touch:create
  - --filesystem=xdg-config/supertuxkart:create
  # Reuse Flathub STK assets (tracks/karts) — system *and* user installs (tablets often use --user).
  - --filesystem=/var/lib/flatpak/app/net.supertuxkart.SuperTuxKart:ro
  - --filesystem=xdg-data/flatpak/app/net.supertuxkart.SuperTuxKart:ro
  - --talk-name=org.freedesktop.UPower
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.portal.Desktop

build-options:
  cflags: -O2
  cxxflags: -O2
  build-args:
    - --share=network

modules:
  - name: supertuxkart-touch
    buildsystem: simple
    build-commands:
      - bash scripts/build-engine.sh
      - bash scripts/stage-flatpak.sh
    sources:
      - type: dir
        path: ..
        skip:
          - engine/build
          - engine/cmake-build-flatpak
          - build-flatpak
          - build-flatpak-prebuilt
          - build-click
          - .flatpak-builder
          - .git
